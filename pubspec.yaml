name: algex
description: "Flutter app that approximates e^x using the Taylor series method."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  fl_chart: ^0.60.0
  window_manager: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#1565C0" 
  adaptive_icon_foreground: "assets/icon.png"
  ios: false
  web:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/